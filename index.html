<!doctype html>
<html lang="ko" class="lr-red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0305">
<title>SDSMP 레이저런</title>
<link rel="icon" href="logos/brand.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;0,800;1,800;1,900&display=swap">
<style>
/* Layout: control-room shell. A fixed navy command rail on the left, a light working canvas on the right.
   TV mode is a full-bleed LED scoreboard that always runs dark. Men = gold, women = blue (from the draw sheets). */
:root {
  --bg: #EEF1F7; --surface: #FFFFFF; --surface-2: #F5F7FC; --line: #D8DEEA; --line-2: #E7EBF3;
  --ink: #0E1834; --ink-2: #4A5574; --ink-3: #7B85A1;
  --rail: #0C1634; --rail-2: #13204A; --rail-ink: #DCE3F5; --rail-dim: #8590B3; --rail-line: #1F2B55;
  --men: #C98F00; --men-fill: #F2B705; --men-soft: #FFF4D1; --women: #3F5BE0; --women-fill: #6E8BFF; --women-soft: #E5EAFF;
  --live: #0E9F57; --on-live: #FFFFFF; --fin: #D12F3C; --win: #17975A; --draw: #7B85A1; --loss: #C2414D;
  --card-y: #F5C400; --card-r: #D92B3A; --ban: #8E1D2B;
  --focus: #3F5BE0; --shadow: 0 1px 2px rgba(14,24,52,.06), 0 8px 24px -12px rgba(14,24,52,.18);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-kr: 'Black Han Sans', 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r-sm: 6px; --r-md: 10px; --rail-w: 252px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1128; --surface: #111A35; --surface-2: #152043; --line: #26325A; --line-2: #1D2850;
  --ink: #E7ECF8; --ink-2: #A9B3CF; --ink-3: #7884A6;
  --rail: #060C1F; --rail-2: #0F1A3D; --rail-line: #18234A;
  --men: #FFC629; --men-fill: #F2B705; --men-soft: #352B0B; --women: #93A6FF; --women-fill: #6E8BFF; --women-soft: #1B2453;
  --live: #34D17F; --on-live: #04220F; --fin: #E5484D; --win: #3CCB82; --draw: #8E99BA; --loss: #FF6B77; --ban: #FF7A86;
  --focus: #93A6FF; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A1128; --surface: #111A35; --surface-2: #152043; --line: #26325A; --line-2: #1D2850;
  --ink: #E7ECF8; --ink-2: #A9B3CF; --ink-3: #7884A6;
  --rail: #060C1F; --rail-2: #0F1A3D; --rail-line: #18234A;
  --men: #FFC629; --men-fill: #F2B705; --men-soft: #352B0B; --women: #93A6FF; --women-fill: #6E8BFF; --women-soft: #1B2453;
  --live: #34D17F; --on-live: #04220F; --fin: #E5484D; --win: #3CCB82; --draw: #8E99BA; --loss: #FF6B77; --ban: #FF7A86;
  --focus: #93A6FF; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num, .tbl td, .tbl th { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; background: var(--rail); color: var(--rail-ink);
  display: flex; flex-direction: column; border-right: 1px solid var(--rail-line); overflow-y: auto; }
.rail-head { padding: 20px 18px 16px; display: flex; gap: 12px; align-items: center; }
.brand-word { font-family: var(--f-display); font-weight: 900; font-size: 30px; letter-spacing: .06em; line-height: .9; color: #fff; }
.brand-sub { font-size: 9.5px; letter-spacing: .16em; color: var(--rail-dim); text-transform: uppercase; margin-top: 4px; line-height: 1.3; }
.rail-sport { margin: 2px 14px 10px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md);
  background: var(--rail-2); border: 1px solid var(--rail-line); }
.rail-sport select { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font-weight: 600; font-size: 15px; appearance: none; cursor: pointer; }
.rail-sport select option { color: #0E1834; }
.rail-sport .lbl { font-size: 10px; letter-spacing: .14em; color: var(--rail-dim); text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; }
.nav-sec { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--rail-dim); padding: 14px 10px 6px; }
.nav-sec { padding: 14px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--rail-dim); text-transform: uppercase; }
.nav-sec.line { padding: 0; margin: 8px 10px; height: 1px; background: rgba(255,255,255,.08); }
html.lr-red .nav-sec { color: rgba(255,170,178,.55); }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; color: var(--rail-ink); text-decoration: none; font-weight: 500; font-size: 14px; position: relative; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .75; }
.nav a:hover { background: var(--rail-2); }
.nav a[aria-current="page"] { background: var(--rail-2); color: #fff; }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--men-fill); }
.nav a[aria-current="page"] svg { opacity: 1; color: var(--men-fill); }
.nav .count { margin-left: auto; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--live); color: var(--on-live); }
.nav .tvdot { margin-left: auto; font-size: 10px; letter-spacing: .1em; color: #7CF0B0; }
.rail-foot { margin-top: auto; padding: 14px 16px 18px; border-top: 1px solid var(--rail-line); display: grid; gap: 10px; font-size: 12px; color: var(--rail-dim); }
.rail-foot .who { display: flex; align-items: center; gap: 8px; color: var(--rail-ink); }
.rail-foot .who img { width: 22px; height: 22px; border-radius: 50%; }
.peers { display: flex; flex-wrap: wrap; gap: 4px; }
.peer { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 3px; border-radius: 99px; background: var(--rail-2); color: var(--rail-ink); font-size: 11px; }
.peer img { width: 16px; height: 16px; border-radius: 50%; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: #3CCB82; display: inline-block; }
.conn.off i { background: #FF6B77; }
.conn.ro i { background: #F5C400; }
.main { min-width: 0; padding-inline: clamp(16px, 3vw, 36px); padding-block: 24px 64px; }
.topbar { display: none; }
.scrim { display: none; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: min(290px, 86vw); height: auto; transform: translateX(-105%); transition: transform .22s ease; padding-top: env(safe-area-inset-top, 0px); }
  .rail.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(6,12,31,.5); }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; align-items: center; gap: 12px; padding: 10px 16px; background: var(--rail); color: #fff; }
  .topbar .brand-word { font-size: 22px; }
  .topbar .icon-btn { color: #fff; border-color: var(--rail-line); background: var(--rail-2); }
  .main { padding-block: 18px 56px; }
}

/* ---------- page furniture ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; }
.eyebrow { font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.page-title { font-family: var(--f-kr); font-weight: 400; font-size: clamp(24px, 3vw, 32px); line-height: 1.15; letter-spacing: -.01em; margin-top: 4px; }
.page-desc { color: var(--ink-2); margin-top: 6px; max-width: 68ch; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-auto { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
@media (max-width: 1100px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel-head h2, .panel-head h3 { font-size: 15px; font-weight: 700; }
.panel-head .sub { color: var(--ink-3); font-size: 12px; }
.panel-head .end { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-body { padding: 14px 16px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--ink-2); font-weight: 600; }
.stack { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.hr { height: 1px; background: var(--line-2); margin: 4px 0; }
.scroll-x { overflow-x: auto; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink); opacity: .9; }
.btn-live { background: var(--live); border-color: var(--live); color: var(--on-live); }
.btn-live:hover { background: var(--live); opacity: .9; }
.btn-danger { color: var(--card-r); border-color: color-mix(in srgb, var(--card-r) 40%, var(--line)); }
.btn-danger.armed { background: var(--card-r); color: #fff; border-color: var(--card-r); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.input, .select, .textarea { height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.textarea { height: auto; padding: 8px 10px; line-height: 1.6; width: 100%; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14,24,52,.12); }
.seg button.men[aria-pressed="true"] { background: var(--men-fill); color: #1B1400; }
.seg button.women[aria-pressed="true"] { background: var(--women-fill); color: #fff; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.switch input { appearance: none; width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; margin: 0; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--win); }
.switch input:checked::after { transform: translateX(16px); }

/* ---------- chips & badges ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.men { background: var(--men-soft); color: var(--men); border-color: transparent; }
.chip.women { background: var(--women-soft); color: var(--women); border-color: transparent; }
.chip.live { background: var(--live); color: var(--on-live); border-color: transparent; }
.chip.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
.chip.final { background: var(--fin); color: #fff; border-color: transparent; }
.chip.sel { background: var(--ink); color: var(--surface); border-color: transparent; }
.chip.warn { background: color-mix(in srgb, var(--card-r) 12%, transparent); color: var(--card-r); border-color: transparent; }
.chip.ban { background: var(--ban); color: #fff; border-color: transparent; }
.chip.ok { background: color-mix(in srgb, var(--win) 14%, transparent); color: var(--win); border-color: transparent; }
@keyframes blink { 50% { opacity: .25; } }
.cardico { display: inline-block; width: 10px; height: 14px; border-radius: 2px; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.cardico.y { background: var(--card-y); }
.cardico.r { background: var(--card-r); }
.grp { font-family: var(--f-display); font-weight: 900; letter-spacing: .04em; }
.team { font-weight: 700; font-variant-numeric: tabular-nums; }
.team-chip { display: inline-flex; align-items: baseline; gap: 2px; font-weight: 700; }
.team-chip small { font-weight: 500; color: var(--ink-3); font-size: .78em; }

/* ---------- tables ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-size: 11px; font-weight: 600; color: var(--ink-3); text-align: center; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; letter-spacing: .02em; }
.tbl td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .l { text-align: left; }
.tbl .r { text-align: right; }
.tbl .pts { font-weight: 800; font-size: 14px; }
.tbl tr.adv td:first-child { box-shadow: inset 3px 0 0 var(--win); }
.rank { font-family: var(--f-display); font-weight: 800; font-size: 17px; width: 30px; }

/* ---------- toast & sheet ---------- */
.toasts { position: fixed; z-index: 90; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--surface); font-size: 13px; box-shadow: var(--shadow); }
.toast.err { background: var(--card-r); color: #fff; }
.sheet-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(6,12,31,.45); display: grid; justify-items: end; }
.sheet { width: min(1080px, 100vw); height: 100%; background: var(--bg); overflow-y: auto; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.modal-wrap { position: fixed; inset: 0; z-index: 80; background: rgba(6,12,31,.45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); margin-bottom: 16px; }
.banner.warn { border-color: color-mix(in srgb, var(--card-y) 60%, var(--line)); background: color-mix(in srgb, var(--card-y) 10%, var(--surface)); }
.banner.err { border-color: color-mix(in srgb, var(--card-r) 50%, var(--line)); background: color-mix(in srgb, var(--card-r) 8%, var(--surface)); }
/* ---------- v2: warm background, logos, medals, schedule cards, player card, tournament ---------- */
:root { --page-grad: radial-gradient(1100px 620px at 88% -8%, rgba(255,190,110,.38), transparent 62%), radial-gradient(900px 640px at -6% 108%, rgba(120,150,255,.22), transparent 60%), linear-gradient(180deg, #F8F4EE, #EEF1F8);
  --adv-grad: linear-gradient(90deg, rgba(242,183,5,.32), rgba(255,250,235,.6) 55%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-grad: radial-gradient(1100px 620px at 88% -8%, rgba(255,170,80,.2), transparent 62%), radial-gradient(900px 640px at -6% 108%, rgba(110,139,255,.2), transparent 60%), linear-gradient(180deg, #111A3A, #0A1128);
  --adv-grad: linear-gradient(90deg, rgba(247,201,72,.3), rgba(255,244,200,.08) 55%, transparent); } }
:root[data-theme="dark"] { --page-grad: radial-gradient(1100px 620px at 88% -8%, rgba(255,170,80,.2), transparent 62%), radial-gradient(900px 640px at -6% 108%, rgba(110,139,255,.2), transparent 60%), linear-gradient(180deg, #111A3A, #0A1128);
  --adv-grad: linear-gradient(90deg, rgba(247,201,72,.3), rgba(255,244,200,.08) 55%, transparent); }
body { background-image: var(--page-grad); background-attachment: fixed; }
.rail { background: linear-gradient(180deg, #14225C, #0C1634 45%, #0A1230); }
.chip.men { background: color-mix(in srgb, var(--men-fill) 24%, var(--surface)); color: var(--men); border-color: color-mix(in srgb, var(--men-fill) 60%, transparent); }
.chip.women { background: color-mix(in srgb, var(--women-fill) 24%, var(--surface)); color: var(--women); border-color: color-mix(in srgb, var(--women-fill) 60%, transparent); }
.chip.lr { height: 18px; padding: 0 6px; font-size: 10px; background: var(--rail-2); color: #C9D3F5; border-color: transparent; }
.chip.medal.m1 { background: linear-gradient(135deg, #FFE58A, #E0A800); color: #3A2A00; border: 0; }
.chip.medal.m2 { background: linear-gradient(135deg, #F4F6FA, #AEB6C6); color: #1E2433; border: 0; }
.chip.medal.m3 { background: linear-gradient(135deg, #F6C9A6, #B8683A); color: #2E1505; border: 0; }
.tlogo { display: inline-grid; place-items: center; flex: none; overflow: hidden; }
.tlogo img { width: 100%; height: 100%; object-fit: contain; }
.tlogo.mono svg { width: 100%; height: 100%; overflow: visible; }
.tlogo.mono path { fill: color-mix(in srgb, var(--ink-3) 18%, transparent); stroke: var(--ink-3); stroke-width: 2.5; }
.tlogo.mono.M path { fill: color-mix(in srgb, var(--men-fill) 22%, transparent); stroke: var(--men-fill); }
.tlogo.mono.W path { fill: color-mix(in srgb, var(--women-fill) 22%, transparent); stroke: var(--women-fill); }
.tlogo.mono text { font-family: var(--f-display); font-weight: 900; font-size: 18px; fill: currentColor; }
.tv .tlogo.mono text { fill: #EEF2FF; }
.vs .t b, .team-cell b, .fx-vs b { white-space: nowrap; }
.tvt th, .tvt td { white-space: nowrap; }
.fit { height: 100%; overflow: hidden; }
.team-cell, .tname-inline { display: inline-flex; align-items: center; gap: 6px; }
.vs .t { display: flex; align-items: center; gap: 8px; min-width: 0; } .vs .h { justify-content: flex-end; }
.pk-note { display: block; font-size: 11px; font-family: var(--f-body); color: var(--ink-3); font-weight: 600; }
.gletter { background: color-mix(in srgb, var(--men-fill) 24%, var(--surface)); border: 1px solid color-mix(in srgb, var(--men-fill) 55%, transparent); }
.W .gletter { background: color-mix(in srgb, var(--women-fill) 24%, var(--surface)); border-color: color-mix(in srgb, var(--women-fill) 55%, transparent); }
.gletter.sm { width: 30px; height: 30px; font-size: 24px; }
.tbl tr.adv { background: var(--adv-grad); } .tbl tr.adv .rank { color: var(--men); }

  background: linear-gradient(90deg, rgba(242,183,5,.2), rgba(110,139,255,.14)); border: 1px solid rgba(242,183,5,.5); }

.tv-start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,10,26,.82); z-index: 3; }
.tv-start button { font-size: 1.8em; padding: .7em 1.6em; border-radius: .6em; border: 0; background: #F2B705; color: #1B1400; font-weight: 700; }

/* ---------- v4: status colours, date calendar, stage tabs, match clock, assist picker, goal timeline, TV fly-in ---------- */
:root { --clock: #F2B705; --clock-over: #FF9F43; }
.rec-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
.datebox { position: relative; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.date-btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; color: var(--ink-2); min-width: 0; }
.date-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.date-btn.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.minical { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: grid; gap: 8px; }
.mc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mc-head b { font-size: 14px; }
.mc-head .icon-btn { width: 30px; height: 30px; }
.mc-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.mc-wd { font-size: 11px; color: var(--ink-3); text-align: center; padding: 2px 0 4px; font-weight: 600; }
.mc-wd.sun { color: var(--fin); } .mc-wd.sat { color: var(--women); }
.mc-day { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 8px; background: transparent; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); padding: 0; }
.mc-day:hover { background: var(--surface-2); }
.mc-day.has { color: var(--ink); font-weight: 700; background: color-mix(in srgb, var(--men-fill) 16%, transparent); }
.mc-day i { position: absolute; right: 2px; top: 1px; font-style: normal; font-size: 9px; font-weight: 800; color: var(--men); }
.mc-day.live::after { content: ""; position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--live); }
.mc-day.today { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.mc-day.sel { background: var(--ink); color: var(--surface); }
.mc-day.sel i { color: var(--surface); }
.mc-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line-2); padding-top: 8px; }
.stage-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.stage-tabs button { border: 0; background: transparent; padding: 10px 14px; font-weight: 700; font-size: 14px; color: var(--ink-3); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.stage-tabs button b { font-family: var(--f-display); font-size: 16px; min-width: 22px; padding: 0 6px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.stage-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--men-fill); }
.stage-tabs button[aria-selected="true"] b { background: var(--men-fill); color: #1B1400; }

/* match clock inside the dark score board */
.clockbar { grid-column: 1 / -1; display: grid; justify-items: center; gap: 8px; padding-top: 6px; }
.kick { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 26px; border: 0; border-radius: 99px; background: #3DDC84; color: #04220F; font-weight: 800; font-size: 16px; box-shadow: 0 6px 20px -8px rgba(61,220,132,.7); }
.kick:hover { filter: brightness(1.06); }
.clk-sub { font-size: 12px; color: var(--rail-dim); }
.clk { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; justify-content: center; font-variant-numeric: tabular-nums; }
.clk .ph { font-weight: 800; font-size: 14px; letter-spacing: .08em; color: #3DDC84; }
.clk .t { font-family: var(--f-display); font-weight: 900; font-size: clamp(40px, 7vw, 56px); line-height: 1; color: #fff; letter-spacing: .03em; }
.clk .of { font-size: 13px; color: var(--rail-dim); }
.clk .add { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: rgba(255,159,67,.18); color: var(--clock-over); }
.clockbar.over .clk .t { color: var(--clock-over); }
.clockbar.paused .clk .t { animation: blink 1.2s infinite; }
.clockbar.ht .clk .ph, .clockbar.ft .clk .ph { color: var(--rail-ink); }
.clk-bar { width: min(320px, 80%); height: 5px; border-radius: 99px; background: var(--rail-2); overflow: hidden; }
.clk-bar i { display: block; height: 100%; background: #3DDC84; border-radius: inherit; transition: width .5s linear; }
.clockbar.over .clk-bar i { background: var(--clock-over); }
.clk-ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.board .btn.ghost { background: var(--rail-2); border-color: var(--rail-line); color: #fff; }
.board .btn.half { background: #fff; border-color: #fff; color: #0C1634; }
.board .btn.fin { background: var(--fin); border-color: var(--fin); color: #fff; }
.board .btn.pulse { animation: pulse 1.4s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.45); } 50% { box-shadow: 0 0 0 7px rgba(255,255,255,0); } }

/* assists are picked from the goal flow; the count shows read-only */
.apill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px dashed var(--line); color: var(--ink-3); }
.apill small { font-size: 10px; font-weight: 600; }
.apill b { font-family: var(--f-display); font-weight: 900; font-size: 20px; min-width: 14px; text-align: center; }
.apill.on { border-style: solid; color: var(--ink); }

/* assist picker */
.pick { width: min(440px, 100%); padding: 18px; display: grid; gap: 12px; }
.pick-head { display: flex; align-items: center; gap: 12px; }
.pick-head > div { display: grid; }
.pick-title { font-family: var(--f-kr); font-weight: 400; font-size: 26px; line-height: 1.1; }
.pick-sub { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pick-q { font-weight: 700; color: var(--ink-2); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr)); gap: 6px; }
.pick-btn { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 15px; color: var(--ink); padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-btn:hover { border-color: var(--men-fill); background: color-mix(in srgb, var(--men-fill) 14%, var(--surface)); }
.pick.W .pick-btn:hover { border-color: var(--women-fill); background: color-mix(in srgb, var(--women-fill) 14%, var(--surface)); }
.pick-btn.on, .pick-none.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pick-none { height: 42px; border-radius: 10px; border: 1px dashed var(--line); background: transparent; font-weight: 600; color: var(--ink-2); }
.pick-none:hover { border-style: solid; color: var(--ink); }
.pick-foot { display: flex; justify-content: flex-end; }

/* goal timeline */
.tl { list-style: none; margin: 0; padding: 4px 0; }
.tl-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line-2); box-shadow: inset 3px 0 0 var(--ink-3); }
.tl-row.H { box-shadow: inset 3px 0 0 var(--men-fill); }
.W .tl-row.H { box-shadow: inset 3px 0 0 var(--women-fill); }
.tl-row:last-child { border-bottom: 0; }
.tl-t { font-family: var(--f-display); font-weight: 800; font-size: 17px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  --page-grad: radial-gradient(1100px 640px at 86% -10%, rgba(52,98,255,.30), transparent 62%), radial-gradient(900px 640px at -6% 108%, rgba(120,90,255,.20), transparent 60%), linear-gradient(180deg, #0B1648, #050B28); } }

}

  radial-gradient(45% 40% at 4% -6%, rgba(40,170,255,.20), transparent 60%), linear-gradient(180deg, #030B36 0%, #061451 48%, #020620 100%); --star: 200,215,255; --star-a: 1; }

    rgba(150,185,255,.09) 39deg, transparent 44deg 50deg, rgba(150,185,255,.06) 55deg, transparent 60deg 360deg);

.tv { grid-template-columns: minmax(0, 1fr); }

/* v13: SNS lightbox + colour swatches */

.story-zoom { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); opacity: 0; transition: opacity .15s; }
button.story-frame:hover .story-zoom, button.story-frame:focus-visible .story-zoom { opacity: 1; }
@media (hover: none) { .story-zoom { opacity: .9; } }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: 600 13px var(--f-body); cursor: pointer; }

.lb { position: fixed; inset: 0; z-index: 90; background: rgba(2,4,12,.94); display: grid; place-items: center; padding: 16px 72px; }
.lb-fig { margin: 0; display: grid; gap: 12px; justify-items: center; max-width: 100%; }
.lb-img { position: relative; height: min(calc(100dvh - 120px), calc((100vw - 160px) * 16 / 9)); aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.lb-img img { display: block; width: 100%; height: 100%; object-fit: contain; }
.lb-img .safe { position: absolute; left: 0; right: 0; height: 13.02%; pointer-events: none; background: repeating-linear-gradient(135deg, rgba(229,72,77,.16) 0 8px, rgba(229,72,77,.05) 8px 16px); }
.lb-img .safe.t { top: 0; border-bottom: 1.5px dashed rgba(255,120,120,.85); }
.lb-img .safe.b { bottom: 0; border-top: 1.5px dashed rgba(255,120,120,.85); }
.lb-fig figcaption { display: flex; align-items: center; gap: 14px; color: #fff; width: 100%; justify-content: space-between; }
.lb-fig figcaption b { display: block; font-size: 15px; }
.lb-fig figcaption span { font-size: 12px; color: rgba(255,255,255,.65); }
.lb-x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; cursor: pointer; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; cursor: pointer; }

  .lb-img { height: min(calc(100dvh - 160px), calc((100vw - 24px) * 16 / 9)); }

  .lb-fig figcaption { padding: 0 52px; }
}

/* v14: captains' e-signature */

.kick.sign.done { background: #3DDC84; color: #04220F; box-shadow: 0 6px 20px -8px rgba(61,220,132,.7); }

.sign-res { display: flex; align-items: center; justify-content: center; gap: 16px; font-weight: 700; font-size: 16px; }

.sign-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.sign-img { height: 180px; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.sign-img img, .sv img { max-width: 100%; max-height: 100%; object-fit: contain; }
.sign-actions { display: flex; align-items: center; gap: 8px; }
.sign-view { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* v15: data reset, TV fly-in always on, Ballon d'Or score size */
.banner.ok { background: color-mix(in srgb, var(--win) 8%, var(--surface)); border-color: color-mix(in srgb, var(--win) 35%, var(--line)); }
.banner.ok > svg { color: var(--win); flex: none; margin-top: 1px; }
/* 둘러보기 복사본(소개용 페이지) 맨 위 안내 — 원본에서는 쓰지 않는다 */
.banner.viewer { align-items: center; border-color: color-mix(in srgb, #4C8DFF 45%, var(--line)); background: color-mix(in srgb, #4C8DFF 10%, var(--surface)); }
.banner.viewer > svg { color: #6FA3FF; flex: none; }
.banner.viewer > div { flex: 1; line-height: 1.55; }
.banner.viewer > .icon-btn { width: 28px; height: 28px; flex: none; }
.reset-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.reset-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); cursor: pointer; }
.reset-item input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--fin); }
.reset-item.on { border-color: color-mix(in srgb, var(--fin) 55%, var(--line)); background: color-mix(in srgb, var(--fin) 6%, var(--surface-2)); }
.reset-item p { margin: 4px 0 0; }
.reset-sum { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.reset-prog { height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.reset-prog i { display: block; height: 100%; background: var(--fin); transition: width .3s; }
.tv-sc li .gl.mvp { font-size: 2.36em; }
.tv-sc li .gl.mvp em { font-size: .33em; margin-top: .14em; }

/* v16: TV group standings — every group card arrives together: card rises, the letter pops, rows slide in top to bottom, one light sweep */
.tvg-card { position: relative; overflow: hidden; animation: tvgin .7s cubic-bezier(.2,.8,.2,1) .08s both; }
.tvg-card .gh b { display: inline-block; animation: tvgpop .55s cubic-bezier(.3,1.6,.5,1) .3s both; }
.tvg-card .gh span { animation: tvgfade .5s ease .38s both; }
.tvg-card thead tr { animation: tvgfade .45s ease .34s both; }
.tvt tr.rise { animation: tvgrow .55s cubic-bezier(.2,.8,.2,1) both; }
.tvg-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.13) 50%, transparent 62%); transform: translateX(-120%); animation: tvgsweep 1.1s ease-in-out 1.05s both; }
@keyframes tvgin { from { opacity: 0; transform: translateY(1.4em) scale(.965); } to { opacity: 1; transform: none; } }
@keyframes tvgpop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes tvgfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes tvgrow { from { opacity: 0; transform: translateX(1.6em); } to { opacity: 1; transform: none; } }
@keyframes tvgsweep { to { transform: translateX(120%); } }
/* TV is signage: keep the slide fade even when the TV computer asks for reduced motion */
@media (prefers-reduced-motion: reduce) { .tv-slide { animation: tvin .6s ease both; } }

/* v18: best-class award — match-sheet checks (recorder) and the TOP 10 › 베스트 학급 summary */
.bcp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bcp-side { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); min-width: 0; }
.bcp-who { display: flex; align-items: center; gap: 8px; } .bcp-who b { font-size: 15px; }
.bcp-sum { font-size: 12.5px; color: var(--ink-3); } .bcp-sum b { font: 800 18px/1 var(--f-display); color: var(--win); }
.bcp-item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bcp-l { width: 96px; flex: none; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.bcp-seg button { min-width: 54px; }
.bcp-memo { width: 100%; height: 36px; }
.bc-chk { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); cursor: pointer; font: 700 12.5px var(--f-body); white-space: nowrap; }
.bc-chk i { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid currentColor; display: grid; place-items: center; flex: none; }
.bc-chk.on { background: color-mix(in srgb, var(--win) 14%, var(--surface)); border-color: color-mix(in srgb, var(--win) 50%, var(--line)); color: var(--win); }
.bc-chk.on i { background: var(--win); border-color: var(--win); color: #fff; }
.bc-chk:disabled { cursor: default; }
.bc-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.bc-card { display: grid; gap: 8px; align-content: start; padding: 12px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.bc-card.has { border-color: color-mix(in srgb, var(--men-fill) 60%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--men-fill) 14%, var(--surface)), var(--surface) 70%); }
.bc-card.skip { opacity: .7; }
.bc-card-h { display: flex; align-items: center; gap: 8px; } .bc-card-h b { font: 800 20px/1 var(--f-display); letter-spacing: .02em; } .bc-card-h > span { font-size: 12px; color: var(--ink-3); }
.bc-skip { margin-left: auto; font-size: 12px; }
.bc-card-b { display: grid; gap: 6px; }
.bc-lead { display: flex; align-items: center; gap: 10px; } .bc-lead b { font-size: 16px; } .bc-lead span { margin-left: auto; font: 800 22px/1 var(--f-display); color: var(--men); }
.bc-next, .bc-none { font-size: 12.5px; color: var(--ink-3); }
.bc-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bc-set { position: relative; }
.bc-set summary { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; list-style: none; }
.bc-set summary::-webkit-details-marker { display: none; }
.bc-set-body { position: absolute; right: 0; top: 40px; z-index: 20; width: min(560px, calc(100vw - 32px)); display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.bc-pts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; }
.bc-pt { display: flex; align-items: center; gap: 6px; } .bc-pt .input { width: 80px; text-align: right; } .bc-pt span { font-size: 13px; color: var(--ink-3); }
.bc-grade { overflow: hidden; }
.bc-row { display: grid; grid-template-columns: minmax(150px, 1.6fr) repeat(3, minmax(90px, 1fr)) repeat(2, 105px) 84px 40px; gap: 8px; align-items: center; padding: 9px 14px; }
.bc-row > span:not(.c-cls) { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.bc-h { padding-block: 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--ink-3); }
.bc-h > span:first-child { align-items: flex-start !important; font: 800 17px/1 var(--f-display); color: var(--ink); letter-spacing: .02em; }
.bc-item { border-top: 1px solid var(--line-2); } .bc-h + .bc-item { border-top: 0; }
.bc-item.lead > .bc-row { background: color-mix(in srgb, var(--men-fill) 12%, transparent); }
.bc-item.open > .bc-row { background: var(--surface-2); }
.c-cls { display: flex; align-items: center; gap: 8px; min-width: 0; } .c-cls b { font-size: 15px; white-space: nowrap; }
.bc-lg { display: inline-flex; gap: 3px; } .bc-lg i { font-style: normal; font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 99px; }
.bc-lg i.m { background: var(--men-soft); color: var(--men); } .bc-lg i.w { background: var(--women-soft); color: var(--women); }
.c-v b { font: 800 19px/1.1 var(--f-display); } .c-v small, .c-tot small { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.c-v.auto .bc-chk.on { border-style: dashed; }
.c-v b.z, .c-tot b.z { color: var(--line); font-weight: 700; }
@media (max-width: 640px) { .bc-cards { gap: 8px; } .bc-card { padding: 10px 14px; gap: 4px; } }
.c-tot b { font: 800 26px/1 var(--f-display); } .bc-item.lead .c-tot b { color: var(--men); }
.c-more { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; justify-self: end; }
.c-more svg { transition: transform .2s; } .c-more[aria-expanded="true"] svg { transform: rotate(180deg); }
.bc-detail { display: grid; gap: 6px; padding: 4px 14px 14px 52px; background: var(--surface-2); }
.bc-game { display: grid; grid-template-columns: 6.5em minmax(12em, 1fr) minmax(0, 2fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line-2); font-size: 13px; }
.g-when { color: var(--ink-3); white-space: nowrap; } .g-what { font-weight: 600; }
.g-recs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.g-tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--line-2); color: var(--ink-3); white-space: nowrap; }
.g-tag.on { background: color-mix(in srgb, var(--win) 14%, transparent); color: var(--win); }
.g-memo { font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 1100px) {
  .bc-h > span:not(:first-child) { display: none; }
  .bc-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
  .bc-row .c-cls { grid-column: 1 / 3; } .bc-row .c-tot { grid-column: 3; grid-row: 1; }
  .bc-row .c-more { grid-column: 3; justify-self: center; }
  .bc-row > span[data-l]::before { content: attr(data-l); font-size: 11px; font-weight: 700; color: var(--ink-3); margin-bottom: 3px; white-space: nowrap; }
  .bc-detail { padding-left: 14px; }
  .bc-game { grid-template-columns: 1fr auto; } .bc-game .g-what { grid-column: 1 / -1; grid-row: 1; } .bc-game .g-recs { grid-column: 1; }
}
@media (max-width: 640px) { .bcp-cols { grid-template-columns: 1fr; } .bcp-l { width: auto; flex-basis: 100%; } }

/* v19: TV 베스트 학급 TOP 10 — two columns of five, taller rows */
.tv-best .col { grid-template-rows: 1fr; }
.tv-best ol { grid-auto-rows: 5.3em; align-content: center; gap: .35em 0; }
.tv-best li { grid-template-columns: 2.4em auto minmax(0, 1fr) auto; }
.tv-best li .nm { font-size: 1.95em; line-height: 1.15; }
.tv-best li .nm small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; margin: .25em 0 0; font-size: .5em; line-height: 1.3; color: #A9B6E2; white-space: normal; word-break: keep-all; overflow: hidden; }
.tv-best li .nm .gb { font-style: normal; font-size: .46em; font-weight: 800; vertical-align: .35em; margin-left: .6em; padding: .15em .6em; border-radius: 99px; background: #F2B705; color: #241A00; }
.tv-best li .gl { font-size: 2.9em; }

/* v20: 응원가 / 응원깃발 extras under 학급 응원 */
.bcp-sub { margin-top: -4px; flex-wrap: nowrap; align-items: flex-start; }
.bcp-exs { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.bcp-ex { display: inline-flex; align-items: center; gap: 6px; }
.bcp-ex small { font-size: 11.5px; color: var(--ink-3); }
.bcp-note { font-size: 11.5px; color: var(--ink-3); }
.bc-chk.sm { height: 26px; padding: 0 8px 0 5px; font-size: 11.5px; gap: 5px; }
.bc-chk.sm i { width: 15px; height: 15px; border-radius: 4px; }
@media (max-width: 640px) { .bcp-sub .bcp-l { display: none; } .bcp-sub { flex-wrap: wrap; } }

/* v21: keep-awake video (must stay on screen and audible-but-silent for the browser to hold the display awake) */
.keepawake { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; opacity: .02; pointer-events: none; z-index: 1; }
.tv-foot .awake { font-size: .85em; color: #8C97C0; white-space: nowrap; }
.tv-foot .awake::before { content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .4em; vertical-align: .1em; background: #FF8A94; }
.tv-foot .awake.on::before { background: #3DDC84; }
.tv-foot .awake:not(.on) { color: #FFB3B9; }

/* v22: half-time reminder */
.ht-msg { display: grid; justify-items: center; gap: 10px; padding: 6px 0 2px; text-align: center; }
.ht-msg b { font-size: 21px; line-height: 1.35; font-weight: 800; }
.ht-ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, #3DDC84 22%, var(--surface)); color: #0E9F57; }
.kick.go2 { animation: kickglow 1.5s ease-in-out infinite; }
@keyframes kickglow { 0%, 100% { box-shadow: 0 6px 20px -8px rgba(61,220,132,.7), 0 0 0 0 rgba(61,220,132,.55); } 50% { box-shadow: 0 6px 20px -8px rgba(61,220,132,.7), 0 0 0 9px rgba(61,220,132,0); } }

/* v23: the half-time reminder is a bright mint card in both themes, so it stands out from the navy recorder */
.modal.ht-alert { --surface: #FFFFFF; --surface-2: #F1FBF5; --ink: #0E1834; --ink-2: #44506E; --ink-3: #66718E; --line: #CBE8D6; --line-2: #DDF2E5;
  color: var(--ink); background: linear-gradient(180deg, #E3FAEE 0%, #FFFFFF 52%); border: 2px solid #3DDC84;
  box-shadow: 0 24px 60px -12px rgba(0,0,0,.6), 0 0 0 6px rgba(61,220,132,.2); animation: htpop .32s cubic-bezier(.2,1.35,.4,1) both; }
.modal.ht-alert .panel-head h3 { color: #0B8A4B; }
.modal.ht-alert .ht-ico { background: #C9F5DC; color: #0B8A4B; }
.modal.ht-alert .ht-msg b { color: #0E1834; }
@keyframes htpop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

/* v24 · rank movement ▲▼ (TV + settings demo) */
.mv { display: block; font-style: normal; font-family: var(--f-body); font-weight: 800; font-size: .42em; line-height: 1; margin-top: .22em; letter-spacing: 0; white-space: nowrap; }
.mv.up { color: #45E08F; }
.mv.dn { color: #FF7A86; }

/* v30 · TV colour theme (TV 송출 › 배경 꾸미기): the picked colour's hue and saturation (--tv-h / --tv-s) tint the background
   and the card chrome at the TV's own dark lightness, so text stays readable. Every saturation scales with --tv-s, so grey and
   black pick a neutral theme. League colours (M champagne / W lavender), podium, live and qualifying colours stay as they are. */
.tv.tint, .tvp {
  --tvc-hi: hsl(var(--tv-h) calc(var(--tv-s) * .8) 49% / .6); --tvc-lo: hsl(var(--tv-h) calc(var(--tv-s) * .9) 13% / .88);
  --tvc-row: hsl(var(--tv-h) calc(var(--tv-s) * .85) 56% / .5); --tvc-rowlo: hsl(var(--tv-h) calc(var(--tv-s) * .9) 14% / .78);
  --tvc-line: hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 80% / .2);
  --tvc-dim: hsl(var(--tv-h) calc(var(--tv-s) * .4) 67%); --tvc-soft: hsl(var(--tv-h) calc(var(--tv-s) * .75) 84%); --tvc-mute: hsl(var(--tv-h) calc(var(--tv-s) * .27) 57%);
  background: radial-gradient(90% 60% at 50% 122%, hsl(var(--tv-h) var(--tv-s) 59% / .42), transparent 62%),
    radial-gradient(55% 45% at 86% -10%, hsl(calc(var(--tv-h) + 27) var(--tv-s) 70% / .3), transparent 60%),
    radial-gradient(45% 40% at 4% -6%, hsl(calc(var(--tv-h) - 20) var(--tv-s) 58% / .2), transparent 60%),
    linear-gradient(180deg, hsl(var(--tv-h) var(--tv-s) 11%) 0%, hsl(var(--tv-h) var(--tv-s) 17%) 48%, hsl(var(--tv-h) var(--tv-s) 7%) 100%);
}
.tv.tint::before { background: conic-gradient(from -32deg at 50% 112%, transparent 0deg 4deg, hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 79% / .09) 8deg, transparent 12deg 20deg, hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 79% / .06) 25deg, transparent 30deg 34deg,
  hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 79% / .09) 39deg, transparent 44deg 50deg, hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 79% / .06) 55deg, transparent 60deg 360deg); }
.tv.tint .tv-head .league b { background: linear-gradient(180deg, #FFFFFF 35%, var(--tvc-soft)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tv.tint .tv-head .clock { border-left-color: var(--tvc-line); }
.tv.tint .tv-prog { background: hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 80% / .14); }
.tv.tint .tv-foot .dots i:not(.on) { background: hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 80% / .24); }
.tv.tint .tvm, .tv.tint .tvb .bm { background: linear-gradient(160deg, var(--tvc-hi), var(--tvc-lo) 62%); border-color: var(--tvc-line); }
.tv.tint .tvm.live { border-color: #3DDC84; } .tv.tint .tvb .bm.live { border-color: var(--live); }
.tv.tint .tvg-card.M { background: linear-gradient(170deg, rgba(255,226,150,.25), rgba(255,226,150,.07) 45%, hsl(var(--tv-h) calc(var(--tv-s) * .45) 9% / .9) 78%); }
.tv.tint .tvg-card.W { background: linear-gradient(170deg, rgba(170,186,255,.28), rgba(120,140,255,.09) 45%, hsl(var(--tv-h) calc(var(--tv-s) * .7) 11% / .9) 78%); }
.tv.tint .tvt .lr { background: hsl(var(--tv-h) calc(var(--tv-s) * .55) 30%); color: hsl(var(--tv-h) calc(var(--tv-s) * .8) 87%); }
.tv.tint .tv-sc li, .tv.tint .tv-susp div { border-top-color: hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 80% / .11); }
.tv.tint .tv-sc li:not(.p1):not(.p2):not(.p3) { background: linear-gradient(90deg, var(--tvc-row), var(--tvc-rowlo) 70%); }
.tv.tint .tv-sc li.p1 { background: linear-gradient(90deg, rgba(247,201,72,.42), rgba(255,240,190,.08) 70%), var(--tvc-rowlo); }
.tv.tint .tv-sc li.p2 { background: linear-gradient(90deg, rgba(214,222,236,.34), rgba(255,255,255,.06) 70%), var(--tvc-rowlo); }
.tv.tint .tv-sc li.p3 { background: linear-gradient(90deg, rgba(214,138,90,.4), rgba(255,220,200,.06) 70%), var(--tvc-rowlo); }
.tv.tint .tv-sc li.chem .nm .duo { color: hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 81%); }
.tv.tint .tv-nbar { background: linear-gradient(90deg, rgba(242,183,5,.2), hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 72% / .14)), hsl(var(--tv-h) calc(var(--tv-s) * .9) 13% / .8); }
.tv.tint .tv-head .league span, .tv.tint .tv-head .ttl span, .tv.tint .tv-head .clock small, .tv.tint .tv-sc li .nm small, .tv.tint .tv-sc li .gl small,
.tv.tint .tv-empty, .tv.tint .tvb .bmeta, .tv.tint .tv-susp div span, .tv.tint .tv-start p, .tv.tint .tv-foot .bgm > span:last-child, .tv.tint .tv-foot .awake.on { color: var(--tvc-dim); }
.tv.tint .tv-foot { color: var(--tvc-mute); }
.tv.tint .tvm-when span, .tv.tint .tvm-mid small, .tv.tint .tv-sc .gl em, .tv.tint .tvb .bhead, .tv.tint .tv-foot .bgm, .tv.tint .bgm-vol, .tv.tint .tv-best li .nm small { color: var(--tvc-soft); }
.tv.tint .tv-sc li:not(.p1):not(.p2):not(.p3) .rk, .tv.tint .tvm-mid .tv-vs { color: var(--tvc-mute); }
.tv.tint .tv-foot .ctl button { background: hsl(var(--tv-h) calc(var(--tv-s) * .68) 14%); border-color: hsl(var(--tv-h) calc(var(--tv-s) * .48) 25%); }
.tv.tint .bgm-ctl { border-right-color: hsl(var(--tv-h) calc(var(--tv-s) * .48) 25%); }
.tv.tint .tv-start { background: hsl(var(--tv-h) calc(var(--tv-s) * .8) 6% / .82); }
/* settings: palette, effects and a live mini TV */
.bg-body { display: grid; grid-template-columns: minmax(260px, 480px) minmax(0, 1fr); gap: 22px; align-items: start; }
.tvp { --tv-h: 229; --tv-s: 86%; --star: 200,215,255; --star-a: 1; position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; isolation: isolate; color: #EEF2FF; box-shadow: 0 12px 30px -14px rgba(3,8,32,.55); }
.tvp .tv-stars { z-index: 0; }
.tvp-in { position: absolute; inset: 0; z-index: 1; display: grid; grid-template-rows: auto 1fr; gap: 7%; padding: 5% 5% 6%; }
.tvp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: clamp(11px, 2.4vw, 17px); letter-spacing: .03em; }
.tvp-head b { background: linear-gradient(180deg, #FFFFFF 35%, var(--tvc-soft)); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tvp-head span { font-size: 1.5em; }
.tvp-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4%; align-items: start; }
.tvp-card { display: grid; gap: 9px; align-content: start; padding: 10% 9% 12%; border-radius: 9px; border: 1px solid var(--tvc-line); background: linear-gradient(160deg, var(--tvc-hi), var(--tvc-lo) 62%); }
.tvp-card b { font-family: var(--f-display); font-weight: 900; font-size: clamp(13px, 2.8vw, 22px); line-height: 1; color: var(--tvc-soft); }
.tvp-card i { display: block; height: 6px; border-radius: 3px; background: hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 88% / .26); }
.tvp-card.M i:first-of-type, .tvp-card.W i:first-of-type { background: linear-gradient(90deg, rgba(61,220,132,.7), rgba(61,220,132,.15)); }
.tvp-card.M { background: linear-gradient(170deg, rgba(255,226,150,.25), rgba(255,226,150,.07) 45%, hsl(var(--tv-h) calc(var(--tv-s) * .45) 9% / .9) 78%); border-color: rgba(255,224,138,.32); }
.tvp-card.W { background: linear-gradient(170deg, rgba(170,186,255,.28), rgba(120,140,255,.09) 45%, hsl(var(--tv-h) calc(var(--tv-s) * .7) 11% / .9) 78%); border-color: rgba(195,205,255,.32); }
.tvp-card.M b { color: #FFE08A; } .tvp-card.W b { color: #C3CDFF; }
.bg-ctl .field > span:first-child { font-weight: 700; }
.bg-sw { display: flex; flex-wrap: wrap; gap: 9px; margin: 2px 0 4px; }
.bg-dot { position: relative; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 3px solid var(--surface); background: var(--c, #ccc); box-shadow: 0 0 0 1px var(--line); cursor: pointer; overflow: hidden; }
.bg-dot[aria-pressed="true"], .bg-dot.on { box-shadow: 0 0 0 2.5px var(--ink); }
.bg-dot:focus-visible, .bg-dot:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.bg-dot.custom { background: conic-gradient(#ff4d4d, #ffd84d, #57e389, #4dd8ff, #5b6cff, #e64dff, #ff4d4d); }
.bg-dot.custom.on { background: var(--c); }
.bg-dot.custom input { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); opacity: 0; cursor: pointer; border: 0; padding: 0; }
.bg-met { display: grid; gap: 8px; padding: 2px 0 0 44px; }
.bg-met .row { flex-wrap: wrap; }
.bg-l { min-width: 30px; }
@media (max-width: 860px) { .bg-body { grid-template-columns: 1fr; } .bg-met { padding-left: 0; } }

/* v31 · notice lettering (TV 송출 › 공지 글씨): font / weight / size / colour as variables on the TV root, read by the
   notice strip and the last notice scene. The scene shrinks long text to fit (--fit, set by NoticeScene). */
.nb-text { font-family: var(--nb-font, var(--f-kr)); font-weight: var(--nb-w, 400); font-size: calc(2.1em * var(--nb-k, 1)); color: var(--nb-color, #fff); }
.tv-notice { overflow: hidden; min-height: 0; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.tv-notice p { word-break: keep-all; overflow-wrap: anywhere; }
.tv-notice p { font-family: var(--nb-font, var(--f-kr)); font-weight: var(--nb-w, 400); font-size: calc(4em * var(--nb-k, 1) * var(--fit, 1)); color: var(--nb-color, #EEF2FF); }
/* settings */
.nl-body { display: grid; grid-template-columns: minmax(280px, 560px) minmax(0, 1fr); gap: 18px 24px; align-items: start; }
.nl-left { display: grid; gap: 8px; min-width: 0; }
.ntp .ntp-in { position: absolute; inset: 0; z-index: 1; display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); padding: 1.6em 0 1.4em; }
.ntp .ntp-scene { position: relative; min-height: 0; min-width: 0; padding: 0 3em; display: grid; grid-template-columns: minmax(0, 1fr); }
.ntp .tv-nbar { background: linear-gradient(90deg, rgba(242,183,5,.2), hsl(var(--tv-h) calc(var(--tv-s) * 1.1) 72% / .14)), hsl(var(--tv-h) calc(var(--tv-s) * .9) 13% / .8); }
.ntp .tv-notice p { line-height: 1.3; }
.nl-ctl .field > span:first-child, .nl-fh b { font-weight: 700; }
.nl-size { gap: 10px; flex-wrap: nowrap; }
.nl-size input { flex: 1; min-width: 0; }
.nl-warn { color: var(--card-r); font-weight: 600; }
.nl-fonts { grid-column: 1 / -1; display: grid; gap: 12px; }
.nl-fh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.nl-group { display: grid; gap: 6px; }
.nl-gl { font-weight: 700; }
.nl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); gap: 8px; }
@media (max-width: 560px) { .nl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .nl-font { padding: 9px 10px 8px; } .nl-sample { font-size: 19px !important; } }
.nl-font { display: grid; gap: 4px; justify-items: start; min-width: 0; padding: 10px 12px 9px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); text-align: left; cursor: pointer; }
.nl-font:hover:not([disabled]) { border-color: var(--ink-3); }
.nl-font[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--surface); }
.nl-font[disabled] { cursor: default; }
.nl-sample { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
.nl-name { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.nl-font[aria-pressed="true"] .nl-name { color: var(--ink); }
@media (max-width: 860px) { .nl-body { grid-template-columns: minmax(0, 1fr); } }

/* v32 · warnings and errors pop up in the middle of the screen with a little bounce (ordinary notices stay in the corner) */
.alert-pop { position: fixed; inset: 0; z-index: 130; display: grid; place-items: center; padding: 20px; pointer-events: none; }
.alert-card { pointer-events: auto; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px 14px; width: min(440px, 100%);
  padding: 18px 20px 14px; border-radius: 18px; border: 2px solid var(--alert-c); background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  box-shadow: 0 0 0 7px color-mix(in srgb, var(--alert-c) 16%, transparent), 0 30px 70px -24px rgba(0,0,0,.6);
  animation: alert-in .55s cubic-bezier(.2,.9,.3,1) both, alert-out .28s ease-in calc(var(--life, 4200ms) - 280ms) forwards; }
.alert-card.warn { --alert-c: #F2B705; --alert-ink: #2A1E00; }
.alert-card.err { --alert-c: var(--card-r); --alert-ink: #fff; }
.alert-ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--alert-c); color: var(--alert-ink); font-family: var(--f-display); font-weight: 900; font-size: 26px; line-height: 1;
  animation: alert-ring .9s ease-out .15s both; }
.alert-msg { font-size: 16.5px; font-weight: 700; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.alert-ok { grid-column: 2; justify-self: end; font-size: 12px; font-weight: 600; color: var(--ink-3); }
@keyframes alert-in { 0% { opacity: 0; transform: scale(.5) translateY(14px); } 45% { opacity: 1; transform: scale(1.08) translateY(-3px); } 65% { transform: scale(.96); } 82% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes alert-out { to { opacity: 0; transform: scale(.94); } }
@keyframes alert-ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--alert-c) 60%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@media (prefers-reduced-motion: reduce) { .alert-card { animation: alert-out .28s ease-in calc(var(--life, 4200ms) - 280ms) forwards; } .alert-ic { animation: none; } }
@media (max-width: 560px) { .alert-pop { place-items: center; } .alert-msg { font-size: 15.5px; } }

/* v32 · 레이저런 블랙·레드 테마. 레이저런 화면을 열면 app.js가 <html>에 lr-red를 붙인다(풋살 화면은 그대로).
   배경은 .lr-waves(붉은 빛 덩어리가 일렁이고, 빛의 물결선이 흐름)가 그리고, 카드·메뉴·글씨는 어두운 붉은 톤으로 맞춘다.
   기록 화면의 기능 색(달리기 파랑, 사격 노랑, 정지 빨강, 진행 초록)은 그대로 둔다. */
html.lr-red:root {
  --bg: #080405; --surface: #150C0F; --surface-2: #1E1215; --line: #3B2227; --line-2: #2A171B;
  --ink: #F7EDEE; --ink-2: #D6BFC2; --ink-3: #A88E92;
  --rail: #090405; --rail-2: #241014; --rail-ink: #F2E4E6; --rail-dim: #A98A8F; --rail-line: #2C1418;
  --men: #FFC629; --men-fill: #F2B705; --men-soft: #352B0B; --women: #5B76F5; --women-fill: #6E8BFF; --women-soft: #1B2453;
  --live: #34D17F; --on-live: #04220F; --fin: #FF4D5C; --win: #3CCB82; --draw: #9C9093; --loss: #FF6B77; --ban: #FF7A86; --card-r: #FF4A58;
  --focus: #FF5A6B; --score: #5CFFA0; --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 32px -16px rgba(0,0,0,.8);
  --page-grad: none; --adv-grad: linear-gradient(90deg, rgba(247,201,72,.3), rgba(255,244,200,.08) 55%, transparent);
  --star: 255,182,188; --star-a: .85; color-scheme: dark;
}
html.lr-red body { background: #050102; }
html.lr-red .rail { background: linear-gradient(180deg, rgba(48,8,14,.94) 0%, rgba(14,4,6,.96) 40%, rgba(6,2,3,.97) 100%); box-shadow: inset -1px 0 0 rgba(255,70,88,.16); }
html.lr-red .rail-sport { background: rgba(255,60,80,.07); border-color: rgba(255,80,95,.22); }
html.lr-red .nav a:hover { background: rgba(255,60,80,.1); }
html.lr-red .nav a[aria-current="page"] { background: linear-gradient(90deg, rgba(255,50,72,.26), rgba(255,50,72,.06)); color: #fff; }
html.lr-red .nav a[aria-current="page"]::before { background: #FF3B50; box-shadow: 0 0 12px rgba(255,59,80,.8); }
html.lr-red .nav a[aria-current="page"] svg { color: #FF6878; }
html.lr-red .topbar { background: rgba(10,3,5,.92); border-bottom: 1px solid rgba(255,70,88,.18); }
html.lr-red .panel, html.lr-red .modal { background: linear-gradient(180deg, rgba(36,13,18,.9), rgba(17,8,10,.92)); border-color: rgba(255,80,96,.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 16px 36px -22px rgba(0,0,0,.95); }
html.lr-red .panel-head { border-bottom-color: rgba(255,80,96,.16); }
html.lr-red .btn-primary { background: linear-gradient(180deg, #FF4357, #D41E33); border-color: #E2283D; color: #fff; box-shadow: 0 6px 18px -8px rgba(255,40,60,.7); }
html.lr-red .btn-primary:hover { background: linear-gradient(180deg, #FF5568, #DE2439); opacity: 1; }
html.lr-red .btn { border-color: rgba(255,90,105,.26); }
html.lr-red .seg { background: rgba(255,255,255,.03); border-color: rgba(255,80,96,.22); }
html.lr-red .seg button[aria-pressed="true"] { background: #3E161D; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,90,105,.35); }
html.lr-red .chip { border-color: rgba(255,90,105,.2); }
html.lr-red .modal-wrap { background: rgba(0,0,0,.62); }
html.lr-red .toast { background: #2A1116; color: #F7EDEE; border: 1px solid rgba(255,90,105,.35); }
html.lr-red .lr .linklike, html.lr-red .lr .lr-banner-act, html.lr-red .lr .kpi-link { color: #FF8C96; }
html.lr-red .lr { --tint: rgba(255,60,80,.07); --tint-2: rgba(255,60,80,.14); }
html.lr-red .lr .chip-real, html.lr-red .lr .chip-change { color: #FF9AA3; }
html.lr-red .lr .field input[type=range] { accent-color: #FF4A5C; }
html.lr-red .page-title, html.lr-red .lr h1 { text-shadow: 0 2px 22px rgba(255,40,60,.28); }

/* 일렁이는 붉은 파도 배경 (관리 화면: .page / TV: 그대로 들어감). 움직임은 transform만 써서 가볍다. */
.lr-waves { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background: radial-gradient(140% 95% at 50% 118%, #3A060D 0%, #160305 46%, #070102 78%, #040101 100%); }
.lr-waves.page { position: fixed; }
.lr-waves i { position: absolute; display: block; border-radius: 50%; will-change: transform; }
.lr-waves .w1 { left: -30%; width: 160%; height: 78%; bottom: -44%; background: radial-gradient(50% 50% at 50% 50%, rgba(232,22,48,.62), rgba(232,22,48,.22) 45%, rgba(232,22,48,0) 70%);
  animation: lrw1 13s ease-in-out infinite alternate; }
.lr-waves .w2 { left: -55%; width: 110%; height: 70%; bottom: -30%; background: radial-gradient(50% 50% at 50% 50%, rgba(255,70,78,.36), rgba(255,70,78,0) 70%);
  animation: lrw2 17s ease-in-out infinite alternate; }
.lr-waves .w3 { left: 40%; width: 105%; height: 72%; bottom: -36%; background: radial-gradient(50% 50% at 50% 50%, rgba(170,0,28,.55), rgba(170,0,28,0) 70%);
  animation: lrw3 21s ease-in-out infinite alternate; }
.lr-waves .w4 { left: 10%; width: 90%; height: 60%; top: -38%; background: radial-gradient(50% 50% at 50% 50%, rgba(140,8,26,.34), rgba(140,8,26,0) 70%);
  animation: lrw4 25s ease-in-out infinite alternate; }
.lr-waves b { position: absolute; left: 0; width: calc(2 * max(100%, 1100px)); background-repeat: repeat-x; background-size: 50% 100%; will-change: transform; } /* a tile is never narrower than 1100px, so waves stay gentle on phones */

@keyframes lrw1 { 0% { transform: translate3d(-7%, 4%, 0) rotate(-3deg) scale(1, .86); } 50% { transform: translate3d(2%, -3%, 0) rotate(1deg) scale(1.06, 1.08); } 100% { transform: translate3d(7%, 2%, 0) rotate(3deg) scale(.96, 1.14); } }
@keyframes lrw2 { 0% { transform: translate3d(0, 6%, 0) scale(.9); } 100% { transform: translate3d(38%, -8%, 0) scale(1.15, 1.05); } }
@keyframes lrw3 { 0% { transform: translate3d(0, -4%, 0) scale(1.1, .9); } 100% { transform: translate3d(-34%, 6%, 0) scale(.92, 1.12); } }
@keyframes lrw4 { 0% { transform: translate3d(-18%, 0, 0) scale(1); opacity: .7; } 100% { transform: translate3d(22%, 10%, 0) scale(1.2, .9); opacity: 1; } }
@keyframes lrflow { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }

@media (max-width: 760px) { .lr-waves.page .l1 { height: 26%; bottom: 6%; opacity: .55; } .lr-waves.page .l2 { height: 30%; } }
@media (prefers-reduced-motion: reduce) { .lr-waves.page i, .lr-waves.page b { animation: none; } }

/* v33 · activity log per sport (풋살 / 레이저런 / 전체) */
.log-sp { display: inline-block; font-style: normal; font-size: 10.5px; font-weight: 700; padding: 1px 6px; margin-right: 6px; border-radius: 99px; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); vertical-align: 1px; }
.log-sp.lr { background: color-mix(in srgb, var(--card-r) 16%, var(--surface)); color: var(--card-r); border-color: color-mix(in srgb, var(--card-r) 40%, var(--line)); }
/* v55 · 대진표 (추첨 방송과 같은 모양) · 1800×780 판을 통째로 줄여서 쓴다 */
.ka-fit { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; }
.ka-page { position: relative; min-width: 960px; overflow: hidden; border-radius: 12px; margin: 12px; color-scheme: dark;
  background: radial-gradient(ellipse 55% 60% at 50% 50%, rgba(var(--kacc, 242,183,5), .12), transparent 70%), radial-gradient(ellipse at 50% 120%, #10245e 0%, #081132 55%, #040817 100%); }
.panel.W .ka-page { --kacc: 142,164,255; }
.ka { position: absolute; width: 1800px; height: 780px; color: #fff; font-family: "IBM Plex Sans KR", system-ui, sans-serif; }
.ka-fit .ka { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--s, 1)); }
.ka-page .ka { left: 0; top: 18px; transform-origin: 0 0; transform: scale(var(--s, 1)); }
.ka-glow { position: absolute; left: 50%; top: 50%; width: 900px; height: 640px; transform: translate(-50%, -50%); pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(var(--acc), .16), transparent 68%); }
.ka-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.ka-svg path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ka-svg path.idle { stroke: rgba(255,255,255,.17); stroke-width: 3; }
.ka-svg path.lost { stroke: rgba(255,255,255,.1); stroke-width: 3; }
.ka-svg path.in { stroke: rgba(var(--acc), .62); stroke-width: 3.5; }
.ka-svg path.won { stroke: rgb(var(--acc)); stroke-width: 5; }
.ka-svg path.past { stroke: rgba(var(--acc), .4); stroke-width: 3.5; }
.ka-svg path.glow { stroke: rgba(var(--acc), .3); stroke-width: 14; }
.ka-svg circle { fill: #0a1330; stroke: rgba(255,255,255,.4); stroke-width: 2; }
.ka-svg circle.live { fill: #0E9F57; stroke: #7CF0B0; stroke-width: 3; animation: ka-live 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ka-live { 50% { transform: scale(1.35); opacity: .7; } }
.ka-rlabel { position: absolute; top: 4px; transform: translateX(-50%); font: 600 30px/1 "IBM Plex Sans KR", sans-serif; letter-spacing: .04em; color: rgba(255,255,255,.62); white-space: nowrap; }
.ka-slot { position: absolute; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 10px; border-radius: 16px; font: inherit; color: #fff; text-align: left;
  border: 2px solid rgba(var(--acc), .75); background: linear-gradient(90deg, rgba(var(--acc), .26), rgba(9,16,42,.9) 62%); transition: opacity .3s, transform .16s, box-shadow .2s; }
.ka-slot.r { flex-direction: row-reverse; padding: 0 10px 0 16px; text-align: right; background: linear-gradient(270deg, rgba(var(--acc), .26), rgba(9,16,42,.9) 62%); }
.ka-slot b { font: 700 26px/1.1 "IBM Plex Sans KR", sans-serif; white-space: nowrap; }
.ka-slot em { font-style: normal; font: 600 16px "IBM Plex Sans KR", sans-serif; color: rgba(255,255,255,.62); white-space: nowrap; }
.ka-slot:not(.r) em { margin-left: auto; } .ka-slot.r em { margin-right: auto; }
.ka-slot .tlogo, .ka-chip .tlogo { flex: none; }
.ka-slot.out { border-color: rgba(255,255,255,.14); background: rgba(9,16,42,.72); }
.ka-slot.out > * { opacity: .42; } .ka-slot.out .tlogo { filter: grayscale(1); }
.ka-slot.champ { box-shadow: 0 0 0 3px rgba(var(--acc), .35), 0 0 34px rgba(var(--acc), .5); }
button.ka-slot, button.ka-chip, button.ka-pill, button.ka-center { cursor: pointer; }
button.ka-center:hover .ka-fb, button.ka-center:hover .ka-cwin b { color: rgb(var(--acc)); }
button.ka-slot:hover { transform: scale(1.03); box-shadow: 0 0 0 4px rgba(var(--acc), .22), 0 0 30px rgba(var(--acc), .4); }
.ka-sc { position: absolute; transform: translate(-100%, -100%); font: 900 32px/1 "Big Shoulders Display", sans-serif; color: rgba(255,255,255,.4); white-space: nowrap; }
.ka-sc.r { transform: translate(0, -100%); }
.ka-sc.w { color: rgb(var(--acc)); text-shadow: 0 0 16px rgba(var(--acc), .55); }
.ka-sc.lv { color: #7CF0B0; }
.ka-sc small { font-size: 19px; margin-left: 2px; }
.ka-chip { position: absolute; transform: translate(-50%, -50%); height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 6px; border-radius: 8px; border: 0; font: inherit;
  background: linear-gradient(180deg, rgb(var(--acc)), rgba(var(--acc), .82)); color: #141006; box-shadow: 0 0 0 3px rgba(4,8,23,.85), 0 0 26px rgba(var(--acc), .6); white-space: nowrap; }
.ka[data-div=W] .ka-chip { color: #0b1240; }
.ka-chip b { font: 900 25px/1 "Big Shoulders Display", sans-serif; letter-spacing: .02em; }
.ka .ka-chip.out { background: #0d1636; color: rgba(255,255,255,.55); box-shadow: 0 0 0 3px rgba(4,8,23,.85), inset 0 0 0 2px rgba(var(--acc), .3); }
.ka-chip.out .tlogo { filter: grayscale(1); opacity: .6; }
.ka-pill { display: inline-block; padding: 4px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.22); background: rgba(6,10,28,.9); color: rgba(255,255,255,.8);
  font: 600 16px/1.2 "IBM Plex Sans KR", sans-serif; white-space: nowrap; }
.ka-pill.at { position: absolute; transform: translateX(-50%); }
.ka-pill.live { background: #0E9F57; border-color: #7CF0B0; color: #fff; font-weight: 700; letter-spacing: .08em; }
.ka-pill.none { color: rgba(255,255,255,.42); border-style: dashed; }
button.ka-pill:hover, button.ka-chip:hover { box-shadow: 0 0 0 3px rgba(var(--acc), .45), 0 0 24px rgba(var(--acc), .5); }
.ka-center { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: #fff; text-align: center; }
.ka-trophy { display: block; width: 176px; height: 300px; object-fit: contain; filter: drop-shadow(0 0 26px rgba(var(--acc), .32)) drop-shadow(0 18px 30px rgba(0,0,0,.45)); user-select: none; }
.ka-center.done .ka-trophy { animation: ka-tglow 2s ease-in-out infinite; }
